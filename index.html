<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
               
     <div id="principal">   
        <h1>Metric/Imperial Unit Conversion</h1>
               <input type="number" id="convertidor">
               <button style="margin-top: 20px;padding: 10px;">Convert</button>
    
    </div>
     <div id="resultados">
        <div>
            <h3> Length (Meter /Feet)</h3>
            <h3>20 meters= 65,16 feet / 20 feet = 6,096 meters</h3>
        </div>

        <div>
            <h3> Volume (Liters /Gallons)</h3>
            <h3>20 liters= 5 gallons / 20 gallons = 75,7 liters</h3>
        </div>

        <div>
            <h3> Mass(Kilograms/Pounds)</h3>
            <h3>20 kilos = 44,09 pounds / 20 pounds = 9,07 kilos</h3>
        </div>

     </div>



        <script src="index.js"></script>
    </body>
</html>
